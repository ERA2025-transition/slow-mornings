<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Noted — thank you</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%85%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;1,300&family=Mulish:wght@400;600;700;800&display=swap">
<style>
  :root{--wall:#F4F7F9;--ink:#182838;--ink-soft:#40566B;--muted:#7E93A5;--line:#DCE5EC;--aegean:#1F5F7E;--dawn:#E39B6E;--dawn-deep:#CE7A4A;--dawn-wash:#FBEDE2;}
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){--wall:#0F1B27;--ink:#E9F1F6;--ink-soft:#B7C8D4;--muted:#7C93A4;--line:#274056;--aegean:#79BEDD;--dawn:#EBA576;--dawn-deep:#E3925F;--dawn-wash:#26313a;}}
  :root[data-theme="dark"]{--wall:#0F1B27;--ink:#E9F1F6;--ink-soft:#B7C8D4;--muted:#7C93A4;--line:#274056;--aegean:#79BEDD;--dawn:#EBA576;--dawn-deep:#E3925F;--dawn-wash:#26313a;}
  *{box-sizing:border-box;margin:0;}
  body{background:radial-gradient(120% 60% at 50% -10%, var(--dawn-wash) 0%, rgba(251,237,226,0) 55%), var(--wall);
    color:var(--ink);font-family:"Mulish",ui-sans-serif,system-ui,sans-serif;font-size:17px;line-height:1.6;
    min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:520px;margin:0 auto;padding:clamp(64px,14vw,120px) 24px 40px;text-align:center;flex:1;}
  .ey{font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--aegean);margin:0 0 14px;}
  h1{font-family:"Newsreader",Georgia,serif;font-weight:400;font-size:clamp(32px,6vw,44px);line-height:1.06;letter-spacing:-.01em;margin:0 0 16px;text-wrap:balance;}
  p{font-family:"Newsreader",Georgia,serif;font-weight:300;font-size:19px;line-height:1.5;color:var(--ink-soft);margin:0 auto;max-width:32ch;}
  .sig{margin-top:22px;font-family:"Newsreader",Georgia,serif;font-style:italic;font-size:18px;color:var(--aegean);}
  footer{padding:26px 24px 44px;text-align:center;color:var(--muted);font-size:12.5px;}
  footer a{color:var(--muted);}
</style>
</head>
<body>
  <div class="wrap">
    <p class="ey">Noted ☕</p>
    <h1>Thank you — that helps more than you know.</h1>
    <p>I'll use it to send you the right mornings next. Keep an eye on your inbox.</p>
    <p class="sig">— Eunice</p>
  </div>
  <footer>
    Travel Adventures by Eunice — a Rosado Management Solutions brand ·
    <a href="https://rosadomgmtsolutions.com/privacy">Privacy</a> ·
    <a href="https://rosadomgmtsolutions.com/terms">Terms</a>
  </footer>
</body>
</html>
